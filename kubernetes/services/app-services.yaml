apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ride-share
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: ride-share
spec:
  selector:
    app: booking-service
  ports:
    - port: 3001
      targetPort: 3001

---

apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ride-share
spec:
  selector:
    app: payment-service
  ports:
    - port: 3002
      targetPort: 3002

---

apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: ride-share
spec:
  selector:
    app: driver-service
  ports:
    - port: 5001
      targetPort: 5001

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ride-share
spec:
  selector:
    app: user-service
  ports:
    - port: 5000
      targetPort: 5000

---

apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ride-share
spec:
  selector:
    app: notification-service
  ports:
    - port: 5002
      targetPort: 5002

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ride-share
spec:
  selector:
    app: frontend
  ports:
    - port: 4173
      targetPort: 4173
