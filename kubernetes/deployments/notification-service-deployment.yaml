apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ride-share
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service 
          image: ride-share-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
