apiVersion: apps/v1
kind: Deployment
metadata: 
  name: booking-service
  namespace: ride-share
spec:
  replicas: 1
  selector:
     matchLabels:
        app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: ride-share-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: ride-share-platform
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: ride-share-platform
                  key: MONGO_PORT
            - name: MONGO_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ride-share-platform
                  key: MONGO_DB_NAME
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
