apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: ride-share
spec:
  replicas: 1
  serviceName: mongo-service
  selector:
    matchLabels:
      app: mongo
    template:
      metadata:
        labels:
          app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - containerPort: 27017 
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: ride-share-platform
                  key: MONGO_DB_NAME
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: ride-share-mongodb-secrets
                  key: MONGO_PASSWORD
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc